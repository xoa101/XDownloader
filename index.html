<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XDownloader</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--card2:#1a1f2b;--bd:#252b38;--tx:#e6e9f0;--mu:#8b93a7;--ac:#00d68f;--ac2:#00b3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:36px 18px;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(700px 400px at 15% -10%,rgba(0,214,143,.10),transparent 60%),radial-gradient(700px 400px at 85% 0%,rgba(0,179,255,.09),transparent 60%)}
.wrap{max-width:480px;margin:0 auto;position:relative;z-index:1}
h1{text-align:center;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
h1 span{background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mu);margin-bottom:28px;font-size:.95rem}
input{width:100%;max-width:100%;display:block;margin:0 auto 28px;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-size:.95rem;font-family:inherit;outline:none;transition:.2s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,214,143,.12)}
input::placeholder{color:#5b6478}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;transition:transform .25s,border-color .25s,box-shadow .25s;animation:in .4s ease backwards}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);border-color:rgba(0,214,143,.4);box-shadow:0 18px 40px -20px rgba(0,0,0,.9)}
.info h3{font-size:1.6rem;font-weight:700;text-align:left;margin-bottom:12px;letter-spacing:-.02em}
.meta-row{display:flex;justify-content:space-between;align-items:center;width:100%;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.7rem;font-weight:600;color:#9aa3b7;background:rgba(255,255,255,.045);border:1px solid var(--bd);padding:4px 10px;border-radius:7px}
.dev-name{font-size:.8rem;color:var(--mu);font-weight:500;white-space:nowrap}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04140e;font-weight:700;font-size:.85rem;text-decoration:none;border:none;cursor:pointer;font-family:inherit;box-shadow:0 8px 18px -9px rgba(0,214,143,.6);transition:.2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn svg{width:14px;height:14px;stroke:#04140e;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;padding:60px 20px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:1rem;margin-bottom:6px}
.count{text-align:center;color:var(--mu);font-size:.85rem;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:rgba(20,23,32,.97);border:1px solid rgba(0,214,143,.4);color:var(--tx);padding:12px 20px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:99;backdrop-filter:blur(10px);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>X<span>Downloader</span></h1>
  <p class="sub">Fast, safe &amp; free APK downloads</p>

  <input id="q" type="search" placeholder="Search apps…" autocomplete="off">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><b>No apps found</b>Try another search.</div>
</div>
<div class="toast" id="toast"></div>

<script>
  
  
<!-- Apks -->

const apps = [
  {
    name: "Board Questions.apk",
    dev:  "Zoa",
    ver:  "1.0.0",
    size: "9.02MB",
    link: "apks/Board_Questions_v1.0.apk"
  }
  
];

/* ---------- engine ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let q = '';

function render(){
  const list = apps.filter(a => {
    const hay = [a.name, a.dev].join(' ').toLowerCase();
    return !q || hay.includes(q);
  });

  $('count').textContent = list.length + (list.length === 1 ? ' app' : ' apps');
  $('empty').hidden = list.length > 0;

  $('grid').innerHTML = list.map((a,i) => {
    const tags = [a.ver?`<span class="tag">v${esc(a.ver)}</span>`:'',
                  a.size?`<span class="tag">${esc(a.size)}</span>`:''].join('');
    return `
      <article class="card" style="animation-delay:${i*45}ms">
        <div class="info">
          <h3 title="${esc(a.name)}">${esc(a.name)}</h3>
        </div>
        <div class="meta-row">
          <div class="tags">${tags}</div>
          <div class="dev-name">Developer: ${esc(a.dev||'Unknown')}</div>
        </div>
        <div class="bottom">
          <a class="btn" href="${esc(a.link||'#')}" download>
            <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 12l5 5 5-5"/><path d="M4 20h16"/></svg>
            Download APK
          </a>
        </div>
      </article>`;
  }).join('');
}

$('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });

let tt;
$('grid').addEventListener('click', e => {
  const btn = e.target.closest('.btn'); if(!btn) return;
  const href = btn.getAttribute('href');
  if(!href || href === '#'){ e.preventDefault(); toast('⚠️ No APK file linked.'); return; }
  const name = btn.closest('.card').querySelector('h3').textContent;
  toast('⬇️ Downloading ' + name + '…');
});
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2500); }

render();
</script>
</body>
</html>
